# ══════════════════════════════════════════════════════════════
#  Render Blueprint — نشر «درب الألمانية» على Render
#  (يُستخدم عند الرفع عبر "Blueprint" أو "New Web Service")
# ══════════════════════════════════════════════════════════════
services:
  - type: web
    name: deutschpfad
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_APP_URL
        value: https://deutschpfad.onrender.com
      # ── مفاتيح الذكاء الاصطناعي (اختيارية) ──
      # أضفها من لوحة تحكم Render (Environment) بعد النشر:
      # GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY
      - key: NEXT_PUBLIC_LLM_DAILY_LIMIT
        value: "50"
